name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure case-sensitive Git paths
        shell: bash
        run: |
          git config core.ignorecase false
          python3 - <<'PY'
          import subprocess
          from collections import defaultdict
          paths = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          grouped = defaultdict(list)
          for path in paths:
              grouped[path.casefold()].append(path)
          collisions = [items for items in grouped.values() if len(items) > 1]
          if collisions:
              print("Case-insensitive path collisions found:")
              for items in collisions:
                  print("  " + " | ".join(items))
              raise SystemExit(1)
          print(f"Checked {len(paths)} tracked paths; no case collisions found.")
          PY

      - name: Validate case-sensitive C++ includes
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          source_root = Path("app/src/main/cpp")
          include_dirs = [
              source_root,
              source_root / "opus/include",
              source_root / "multiplayer",
              source_root / "multiplayer/vendor/imgui",
              source_root / "multiplayer/vendor",
              source_root / "multiplayer/game/RW",
              source_root / "multiplayer/game",
              source_root / "multiplayer/java_systems",
              source_root / "multiplayer/game/Core",
          ]
          source_extensions = {".c", ".cc", ".cpp", ".cxx", ".h", ".hh", ".hpp", ".hxx"}

          def resolve_case_insensitive(path):
              current = Path(".")
              for part in path.parts:
                  if part in ("", "."):
                      continue
                  exact = current / part
                  if exact.exists():
                      current = exact
                      continue
                  if not current.is_dir():
                      return None
                  matches = [entry for entry in current.iterdir() if entry.name.casefold() == part.casefold()]
                  if len(matches) != 1:
                      return None
                  current = matches[0]
              return current

          mismatches = []
          include_pattern = re.compile(r"^\s*#\s*include\s*([<\"])([^>\"]+)[>\"]")
          for source in source_root.rglob("*"):
              if not source.is_file() or source.suffix.lower() not in source_extensions:
                  continue
              for line_number, line in enumerate(source.read_text(errors="ignore").splitlines(), 1):
                  match = include_pattern.match(line)
                  if not match or match.group(1) != '"':
                      continue
                  include_name = match.group(2)
                  candidates = [source.parent / include_name] + [directory / include_name for directory in include_dirs]
                  if any(candidate.is_file() for candidate in candidates):
                      continue
                  for candidate in candidates:
                      actual = resolve_case_insensitive(candidate)
                      if actual is not None and actual.is_file():
                          mismatches.append(f"{source}:{line_number}: {include_name} -> {actual}")
                          break

          if mismatches:
              print("Case-sensitive native include mismatches found:")
              print("\n".join(f"  {item}" for item in mismatches))
              raise SystemExit(1)
          print("Checked quoted native includes; no case mismatches found.")
          PY

      - name: Validate duplicate native libraries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          duplicates = []
          for abi in ("arm64-v8a", "armeabi-v7a"):
              jni_lib = Path(f"app/src/main/jniLibs/{abi}/libbass.so")
              cmake_lib = Path(f"app/src/main/cpp/multiplayer/vendor/bass/libs/{abi}/libbass.so")
              if jni_lib.is_file() and cmake_lib.is_file():
                  duplicates.append(f"{abi}: {jni_lib} and {cmake_lib}")

          if duplicates:
              print("Native libraries are packaged both as jniLibs and CMake inputs:")
              print("\n".join(f"  {item}" for item in duplicates))
              raise SystemExit(1)
          print("No duplicate native library ownership found.")
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleVer_releaseRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sasamp-release-apk
          path: app/build/outputs/apk/ver_release/release/*.apk
          if-no-files-found: error
