name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure case-sensitive Git paths
        shell: bash
        run: |
          git config core.ignorecase false
          python3 - <<'PY'
          import subprocess
          from collections import defaultdict
          paths = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          grouped = defaultdict(list)
          for path in paths:
              grouped[path.casefold()].append(path)
          collisions = [items for items in grouped.values() if len(items) > 1]
          if collisions:
              print("Case-insensitive path collisions found:")
              for items in collisions:
                  print("  " + " | ".join(items))
              raise SystemExit(1)
          print(f"Checked {len(paths)} tracked paths; no case collisions found.")
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleVer_releaseRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sasamp-release-apk
          path: app/build/outputs/apk/ver_release/release/*.apk
          if-no-files-found: error
